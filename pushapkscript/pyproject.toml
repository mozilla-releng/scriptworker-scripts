[project]
name = "pushapkscript"
version = "5.0.0"
description = "Taskcluster pushapk worker"
url = "https://github.com/mozilla-releng/scriptworker-scripts/"
license = "MPL-2.0"
readme = "README.md"
authors = [
    { name = "Mozilla Release Engineering", email = "release+python@mozilla.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "aiohttp",
    "google-api-python-client",
    "google-auth",
    "mozilla-version",
    "pyaxmlparser",
    "pyjwt[crypto]",
    "requests",
    "scriptworker",
]

[dependency-groups]
dev = [
    "tox",
    "tox-uv",
    "aioresponses",
    "coverage>=4.2b1",
    "cryptography",
    "mock",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "requests-mock",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
    "src",
]

[tool.hatch.build.targets.wheel.sources]
"src/" = ""

[project.scripts]
pushapkscript = "pushapkscript.script:main"

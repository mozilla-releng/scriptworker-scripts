---

loader: taskgraph.loader.transform:loader

transforms:
    - taskgraph.transforms.docker_image:transforms
    - taskgraph.transforms.cached_tasks:transforms
    - taskgraph.transforms.task:transforms

meta:
    - &py314 "3.14.10-slim-trixie@sha256:22eafb370920ad8b429e0aec3fff433e0669968519f5d60469d83729c138b28b"
    - &uv_version "0.7.15"

tasks:
    python314:
        definition: base-test
        args:
            PYTHON_VERSION: *py314
            UV_VERSION: *uv_version

    # Used by push-image kind
    skopeo: {}

    base:
        args:
            PYTHON_VERSION: *py314
            UV_VERSION: *uv_version
    addonscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: addonscript
    balrogscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: balrogscript
    bitrisescript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: bitrisescript
    beetmoverscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: beetmoverscript
    bouncerscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: bouncerscript
    githubscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: githubscript
    landoscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: landoscript
    shipitscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: shipitscript
    pushapkscript:
        parent: base
    pushflatpakscript:
        parent: base
    pushmsixscript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: pushmsixscript
    signingscript:
        # debian trixie has osslsigncode 2.9.
        # if the debian release changes, verify version of osslsigncode and make sure winsign works as well
        parent: base
    treescript:
        definition: script
        parent: base
        args:
            SCRIPT_NAME: treescript

    # Testing images
    pushapkscript-test-py314:
        definition: base-test
        args:
            PYTHON_VERSION: *py314
            UV_VERSION: *uv_version
            # default-jdk-headless, not the JRE: the tests shell out to jarsigner.
            APT_PACKAGES: default-jdk-headless

    pushflatpakscript-test-py314:
        definition: base-test
        args:
            PYTHON_VERSION: *py314
            UV_VERSION: *uv_version
            # Copied from pushflatpakscript/docker.d/image_setup.sh
            APT_PACKAGES: gir1.2-ostree-1.0 libgirepository-2.0-dev ostree

    signingscript-test-py314:
        definition: base-test
        args:
            PYTHON_VERSION: *py314
            UV_VERSION: *uv_version
            APT_PACKAGES: osslsigncode cmake make clang gpg gpgv

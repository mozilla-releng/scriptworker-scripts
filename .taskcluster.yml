---
version: 1
reporting: checks-v1
policy:
    pullRequests: public_restricted
hooks:
    - name: lint/pre-commit-v1
tasks:
    - $let:
          trustDomain: scriptworker
          # Github events have this stuff in different places...
          ownerEmail:
              $switch:
                  'tasks_for == "github-push"': '${event.pusher.email}'
                  'tasks_for[:19] == "github-pull-request"': '${event.pull_request.user.login}@users.noreply.github.com'
                  'tasks_for in ["cron", "action"]': '${tasks_for}@noreply.mozilla.org'
          baseRepoUrl:
              $switch:
                  'tasks_for == "github-push"': '${event.repository.html_url}'
                  'tasks_for[:19] == "github-pull-request"': '${event.pull_request.base.repo.html_url}'
                  'tasks_for in ["cron", "action"]': '${repository.url}'
          repoUrl:
              $switch:
                  'tasks_for == "github-push"': '${event.repository.html_url}'
                  'tasks_for[:19] == "github-pull-request"': '${event.pull_request.head.repo.html_url}'
                  'tasks_for in ["cron", "action"]': '${repository.url}'
          project:
              $switch:
                  'tasks_for == "github-push"': '${event.repository.name}'
                  'tasks_for[:19] == "github-pull-request"': '${event.pull_request.base.repo.name}'
                  'tasks_for in ["cron", "action"]': '${repository.project}'
          head_branch:
              $switch:
                  'tasks_for == "github-push"': ${event.ref}
                  'tasks_for[:19] == "github-pull-request"': ${event.pull_request.head.ref}
                  'tasks_for in ["cron", "action"]': '${push.branch}'
          head_sha:
              $switch:
                  'tasks_for == "github-push"': '${event.after}'
                  'tasks_for[:19] == "github-pull-request"': '${event.pull_request.head.sha}'
                  'tasks_for in ["cron", "action"]': '${push.revision}'
          ownTaskId:
              $switch:
                  '"github" in tasks_for': {$eval: as_slugid("decision_task")}
                  'tasks_for in ["cron", "action"]': '${ownTaskId}'
          pullRequestAction:
              $switch:
                  'tasks_for[:19] == "github-pull-request"': ${event.action}
                  $default: 'UNDEFINED'
          isPullRequest:
              $eval: 'tasks_for[:19] == "github-pull-request"'
          # All scripts that are released via {production,dev}-{script} branch
          allScripts:
              - addonscript
              - balrogscript
              - beetmoverscript
              - bitrisescript
              - bouncerscript
              - githubscript
              # - iscript (iscript has special release via ronin_puppet repo)
              - landoscript
              - pushapkscript
              - pushflatpakscript
              - pushmsixscript
              - shipitscript
              - signingscript
              - treescript
      in:
          # if action/cron OR pr event OR push on protected branches
          $if: >
            tasks_for in ["action", "cron"]
            || (isPullRequest && pullRequestAction in ["opened", "reopened", "synchronize"])
            || (tasks_for == "github-push"
                && head_branch[:11] == "refs/heads/"
                && (head_branch[11:] in ["master", "production", "dev"]
                    || (head_branch[11:22] == "production-" && head_branch[22:] in allScripts)
                    || (head_branch[11:15] == "dev-" && head_branch[15:] in allScripts)
                    )
                )
          then:
              $let:
                  level:
                      $if: 'tasks_for in ["github-push", "cron", "action"] && repoUrl == "https://github.com/mozilla-releng/scriptworker-scripts"'
                      then: 3
                      else: 1
              in:
                  taskId:
                      $if: 'tasks_for != "action"'
                      then: '${ownTaskId}'
                  taskGroupId:
                      $if: 'tasks_for == "action"'
                      then:
                          '${action.taskGroupId}'
                      else:
                          '${ownTaskId}'  # same as taskId; this is how automation identifies a decision task
                  schedulerId: '${trustDomain}-level-${level}'
                  created: {$fromNow: ''}
                  deadline: {$fromNow: '1 day'}
                  expires: {$fromNow: '1 year 1 second'}  # 1 second so artifacts expire first, despite rounding errors
                  metadata:
                      $merge:
                          - owner: "${ownerEmail}"
                            source: '${repoUrl}/raw/${head_sha}/.taskcluster.yml'
                          - $switch:
                                'tasks_for == "github-push" || isPullRequest':
                                    name: "Decision Task"
                                    description: 'The task that creates all of the other tasks in the task graph'
                                'tasks_for == "action"':
                                    name: "Action: ${action.title}"
                                    description: '${action.description}'
                                'tasks_for == "cron"':
                                    name: "Decision Task for cron job ${cron.job_name}"
                                    description: 'Created by a [cron task](https://tools.taskcluster.net/tasks/${cron.task_id})'
                  provisionerId: "${trustDomain}-${level}"
                  workerType: "decision"
                  tags:
                      $switch:
                          'tasks_for == "github-push" || isPullRequest':
                              kind: decision-task
                          'tasks_for == "action"':
                              kind: 'action-callback'
                          'tasks_for == "cron"':
                              kind: cron-task
                  routes:
                      $flatten:
                          - checks
                          - $if: 'tasks_for == "github-push"'
                            then:
                                - "index.${trustDomain}.v2.${project}.revision.${head_sha}.taskgraph.decision"
                            else: []
                  scopes:
                      # `https://` is 8 characters so, ${repoUrl[8:]} is the repository without the protocol.
                      $switch:
                          'tasks_for == "github-push"':
                              $let:
                                  short_head_branch:
                                      $if: 'head_branch[:10] == "refs/tags/"'
                                      then: {$eval: 'head_branch[10:]'}
                                      else:
                                          $if: 'head_branch[:11] == "refs/heads/"'
                                          then: {$eval: 'head_branch[11:]'}
                                          else: ${head_branch}
                              in:
                                  - 'assume:repo:${repoUrl[8:]}:branch:${short_head_branch}'

                          isPullRequest:
                              - 'assume:repo:github.com/${event.pull_request.base.repo.full_name}:${tasks_for[7:]}'
                          'tasks_for == "action"':
                              - 'assume:repo:${repoUrl[8:]}:action:${action.action_perm}'
                          'tasks_for == "cron"':
                              - 'assume:repo:${repoUrl[8:]}:cron:${cron.job_name}'

                  requires: all-completed
                  priority: lowest
                  retries: 5

                  payload:
                      env:
                          # run-task uses these to check out the source; the inputs
                          # to `mach taskgraph decision` are all on the command line.
                          $merge:
                              - SCRIPTWORKER_BASE_REPOSITORY: '${baseRepoUrl}'
                                SCRIPTWORKER_HEAD_REPOSITORY: '${repoUrl}'
                                SCRIPTWORKER_HEAD_REF: '${head_branch}'
                                SCRIPTWORKER_HEAD_REV: '${head_sha}'
                                SCRIPTWORKER_REPOSITORY_TYPE: git
                                REPOSITORIES: {$json: {scriptworker: "Scriptworker-scripts"}}
                              - $if: 'isPullRequest'
                                then:
                                    SCRIPTWORKER_PULL_REQUEST_NUMBER: '${event.pull_request.number}'
                              - $if: 'tasks_for == "action"'
                                then:
                                    ACTION_TASK_GROUP_ID: '${action.taskGroupId}'  # taskGroupId of the target task
                                    ACTION_TASK_ID: {$json: {$eval: 'taskId'}}  # taskId of the target task (JSON-encoded)
                                    ACTION_INPUT: {$json: {$eval: 'input'}}
                                    ACTION_CALLBACK: '${action.cb_name}'
                      features:
                          taskclusterProxy: true
                          chainOfTrust: true
                      # Note: This task is built server side without the context or tooling that
                      # exist in tree so we must hard code the hash
                      image: mozillareleases/taskgraph:decision-v24.2.0@sha256:08ee0e7c71ac117a848efef3f929f309d6b49fa84067e5a98f6db6801346e8a2
                      maxRunTime: 1800

                      command:
                          - run-task
                          - '--scriptworker-checkout=/builds/worker/checkouts/src'
                          - '--task-cwd=/builds/worker/checkouts/src'
                          - '--'
                          - bash
                          - -cx
                          - $let:
                                extraArgs: {$if: 'tasks_for == "cron"', then: '${cron.quoted_args}', else: ''}
                            in:
                                $if: 'tasks_for == "action"'
                                then: >
                                    cd /builds/worker/checkouts/src &&
                                    ln -s /builds/worker/artifacts artifacts &&
                                    taskgraph action-callback
                                else: >
                                    ln -s /builds/worker/artifacts artifacts &&
                                    taskgraph decision
                                    --pushlog-id='0'
                                    --pushdate='0'
                                    --project='${project}'
                                    --message=""
                                    --owner='${ownerEmail}'
                                    --level='${level}'
                                    --base-repository="$SCRIPTWORKER_BASE_REPOSITORY"
                                    --head-repository="$SCRIPTWORKER_HEAD_REPOSITORY"
                                    --head-ref="$SCRIPTWORKER_HEAD_REF"
                                    --head-rev="$SCRIPTWORKER_HEAD_REV"
                                    --repository-type="$SCRIPTWORKER_REPOSITORY_TYPE"
                                    --tasks-for='${tasks_for}'
                                    ${extraArgs}

                      artifacts:
                          'public':
                              type: 'directory'
                              path: '/builds/worker/artifacts'
                              expires: {$fromNow: '1 year'}
                          'public/docker-contexts':
                              type: 'directory'
                              path: '/builds/worker/checkouts/src/docker-contexts'
                              # This needs to be at least the deadline of the
                              # decision task + the docker-image task deadlines.
                              # It is set to a week to allow for some time for
                              # debugging, but they are not useful long-term.
                              expires: {$fromNow: '7 day'}

                  extra:
                      $merge:
                          - $if: 'tasks_for == "action"'
                            then:
                                parent: '${action.taskGroupId}'
                                action:
                                    name: '${action.name}'
                                    context:
                                        taskGroupId: '${action.taskGroupId}'
                                        taskId: {$eval: 'taskId'}
                                        input: {$eval: 'input'}
                          - $if: 'tasks_for == "cron"'
                            then:
                                cron: {$json: {$eval: 'cron'}}
                          - tasks_for: '${tasks_for}'
